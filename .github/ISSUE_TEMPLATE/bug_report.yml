name: Bug Report
description: Report a problem in BirdNET-Go+
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report problems with this fork here. Search existing issues before opening a new one.
        Remove credentials, private addresses, and other personal information from logs or screenshots.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the branch or commit and build date when available.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, hardware, and how you installed or built this fork.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include relevant details after removing private information.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Audio source, configuration changes, or other details that may help.
